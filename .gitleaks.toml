title = "Sensorvision Gitleaks Configuration"
version = "2.0.0"

[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["key", "AWS"]
paths = [
    "!**/*Test.java",
    "!**/*test.ts",
    "!**/*test.tsx",
    "!**/*.test.ts",
    "!**/*.test.tsx",
    "!**/*spec.ts",
    "!**/*spec.tsx",
    "!docs/",
    "!**/*.md",
    "!**/*.example",
    "!**/*.template"
]

[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
tags = ["key", "GitHub"]
paths = [
    "!**/*Test.java",
    "!**/*test.ts",
    "!**/*test.tsx",
    "!**/*.test.ts",
    "!**/*.test.tsx",
    "!**/*spec.ts",
    "!**/*spec.tsx",
    "!docs/",
    "!**/*.md",
    "!**/*.example",
    "!**/*.template"
]

[[rules]]
id = "github-oauth-token"
description = "GitHub OAuth Token"
regex = '''gho_[0-9a-zA-Z]{36}'''
tags = ["key", "GitHub"]
paths = [
    "!**/*Test.java",
    "!**/*test.ts",
    "!**/*test.tsx",
    "!**/*.test.ts",
    "!**/*.test.tsx",
    "!**/*spec.ts",
    "!**/*spec.tsx",
    "!docs/",
    "!**/*.md",
    "!**/*.example",
    "!**/*.template"
]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY-----'''
tags = ["key", "SSH", "PGP"]
paths = [
    "!**/*Test.java",
    "!**/*test.ts",
    "!**/*test.tsx",
    "!**/*.test.ts",
    "!**/*.test.tsx",
    "!**/*spec.ts",
    "!**/*spec.tsx",
    "!docs/",
    "!**/*.md",
    "!**/*.example",
    "!**/*.template"
]

# Allowlist for known example/test keys
[[allowlist]]
description = "AWS Example Key"
regexes = [
    '''AKIAIOSFODNN7EXAMPLE'''
]

[[allowlist]]
description = "Test files"
paths = [
    "**/*Test.java",
    "**/*test.ts",
    "**/*test.tsx",
    "**/*.test.ts",
    "**/*.test.tsx",
    "**/*spec.ts",
    "**/*spec.tsx"
]

[[allowlist]]
description = "Documentation"
paths = [
    "docs/",
    "**/*.md"
]

[[allowlist]]
description = "Example/template files"
paths = [
    "**/*.example",
    "**/*.template"
]